<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="daybitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#047857" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#daybitGrad)" filter="url(#shadow)" />

  <!-- 4 subtle habit grid blocks -->
  <g fill="#ffffff" opacity="0.14">
    <rect x="76" y="76" width="160" height="160" rx="36" />
    <rect x="276" y="76" width="160" height="160" rx="36" />
    <rect x="76" y="276" width="160" height="160" rx="36" />
    <rect x="276" y="276" width="160" height="160" rx="36" opacity="0.22" />
  </g>

  <!-- Checkmark -->
  <path
    d="M156 260 L236 340 L364 186"
    fill="none"
    stroke="#ffffff"
    stroke-width="54"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
