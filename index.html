<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" type="application/manifest+json" href="/manifest.webmanifest" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Daybit" />
    <meta name="application-name" content="Daybit" />
    <meta name="description" content="Build better habits, track daily streaks, and transform yourself with Daybit." />
    <meta name="theme-color" content="#10b981" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f19" media="(prefers-color-scheme: dark)" />
    <title>Daybit — Build Better Habits &amp; Transform Yourself</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Immediately capture PWA install prompt before bundles load
      window.__daybit_deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__daybit_deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('daybit-pwa-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__daybit_deferredPrompt = null;
        window.dispatchEvent(new CustomEvent('daybit-pwa-installed'));
      });

      /* Instantly remove any Netlify drawer, badge, or injected feedback tool */
      (function () {
        function removeNetlify() {
          var els = document.querySelectorAll('netlify-drawer, [data-netlify-deploy-preview], [class*="netlify"], [id*="netlify"], iframe[src*="netlify"]');
          for (var i = 0; i < els.length; i++) {
            els[i].remove();
          }
        }
        if (typeof MutationObserver !== 'undefined') {
          var obs = new MutationObserver(removeNetlify);
          obs.observe(document.documentElement, { childList: true, subtree: true });
        }
        window.addEventListener('DOMContentLoaded', removeNetlify);
        window.addEventListener('load', removeNetlify);
        setInterval(removeNetlify, 300);
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
